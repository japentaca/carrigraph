# CarriGraph — server block de nginx para carrigraph.jape.com.ar
#
# Plantilla versionada. En el servidor se copia a /etc/nginx/conf.d/carrigraph.jape.com.ar.conf
# (un archivo por sitio). Antes de recargar: `nginx -t` y después `systemctl reload nginx`.
# Ver deploy/README.md.
#
# - Todo va a Node (127.0.0.1:34360): con NODE_ENV=production el servidor sirve dist/, responde
#   index.html a las rutas del SPA y pone las cabeceras de seguridad (helmet) en todas las
#   respuestas. Si se cambia el puerto, cambiarlo también en el .env del servidor.
# - La IP real del visitante ya la resuelve conf.d/cloudflare-realip.conf: acá $remote_addr ya es
#   la IP real. La app la toma de X-Forwarded-For (TRUST_PROXY=loopback en su .env).
# - Certificado de origen de Cloudflare, el mismo de los otros sitios (cubre *.jape.com.ar).

server {
  listen 80;
  listen [::]:80;
  server_name carrigraph.jape.com.ar;

  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name carrigraph.jape.com.ar;

  ssl_certificate     /opt/cert/origin-public.pem;
  ssl_certificate_key /opt/cert/origin-private.pem;

  server_tokens off;
  charset UTF-8;

  # La app acepta cuerpos JSON de hasta 1 MB (proyectos); 2m deja margen.
  client_max_body_size 2m;

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:34360;
  }
}
